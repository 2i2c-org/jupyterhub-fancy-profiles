name: Docs publish

on:
  workflow_run:
    # Matches `name: Docs` in docs-ci.yml
    workflows: [Docs]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of a fork PR to publish a preview for. Leave empty to redeploy the site."
        required: false
        default: ""

jobs:
  publish:
    # Skip failed runs and fork PRs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Keep the plugin version in sync with docs-ci.yml and docs/myst.yml
    uses: DiamondLightSource/myst-version-switcher-plugin/.github/workflows/publish-gh-pages.yml@v0.28.0
    with:
      pr: ${{ inputs.pr }}
      # GitHub Pages sites are capped at 1 GB
      max-releases: "30"
      max-prs: "20"
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      statuses: write
